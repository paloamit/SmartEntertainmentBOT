# ============================================================ Render blueprint
# Lives at the REPOSITORY ROOT so Render auto-detects it as a Blueprint.
# The app lives one level down in EntertainmentBOT/, so every rootDir here
# is relative to the repo root, not to this file.
#
# SECURITY: no secret is ever written into this file or committed to the repo.
# Secrets are NOT declared here at all — on a Blueprint-managed service Render
# reconciles every declared key on each deploy, which wipes any value pasted
# into the dashboard. Undeclared keys are left alone, so the six required
# secrets are entered once, by hand, on the service's Environment tab.
# See the SECRETS block in the API service below for the exact list.

services:
  # ---------------------------------------------------------------- API ----
  - type: web
    name: entertainmentbot-api
    runtime: python
    rootDir: EntertainmentBOT/backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      # ---- models (not secret) ----
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL_LARGE
        value: openai/gpt-oss-120b
      - key: LLM_MODEL_SMALL
        value: openai/gpt-oss-20b
      # Must stay EMPTY. Sending any value makes gpt-oss emit no tool calls
      # at all, which silently breaks every turn. See app/llm.py::_extra().
      - key: LLM_REASONING_EFFORT
        value: ""
      - key: LLM_FAILOVER_ENABLED
        value: "true"
      - key: LLM_FAILOVER_MODELS
        value: openai/gpt-oss-120b,qwen/qwen3.8-27b,openai/gpt-oss-20b

      # ---- second provider: takes over when the whole Groq chain is walled off
      # Groq meters quota per account, so once its daily budget is spent every
      # Groq model fails together and model-level failover cannot help. Gemini
      # has its own quota, so this turns a dead end into a slower answer.
      # Reuses the vision key — same vendor, same OpenAI-compatible endpoint.
      - key: LLM_FALLBACK_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_FALLBACK_MODELS
        value: gemini-3.5-flash
      - key: LLM_FALLBACK_PROVIDER
        value: gemini

      # ---- vision (Gemini via OpenAI-compatible endpoint) ----
      - key: LLM_VISION_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_VISION_MODEL
        value: gemini-3.5-flash

      # ---- SECRETS -------------------------------------------------------
      # DELIBERATELY NOT LISTED HERE.
      #
      # This service is Blueprint-managed, which means Render reconciles the
      # service's env vars against this file on every sync and deploy. A key
      # declared here — even with `sync: false` — is considered MANAGED, so
      # any value pasted into the dashboard is silently wiped on the next
      # deploy. That produced a service that reported `llm_configured: false`
      # no matter how many times the secrets were entered.
      #
      # Fix: leave them out of the blueprint entirely. Render does not touch
      # vars it has no knowledge of, so the dashboard values persist.
      #
      # Add these ONCE, by hand, on the service's Environment tab:
      #   LLM_API_KEY            Groq           (required)
      #   LLM_VISION_API_KEY     Google Gemini  (required for image upload)
      #                           Doubles as the failover provider's key, so
      #                           Groq's daily cap being spent degrades to
      #                           Gemini instead of failing outright.
      #   WATCHMODE_API_KEY      Watchmode      (required: catalog + where-to-watch)
      #   OMDB_API_KEY           OMDb           (required: IMDb ratings)
      #   LANGFUSE_PUBLIC_KEY    Langfuse       (optional: tracing)
      #   LANGFUSE_SECRET_KEY    Langfuse       (optional: tracing)
      #   TMDB_API_KEY           TMDB           (optional: discovery/trailers)
      #   REDIS_URL              Redis          (optional: shared cache)
      #   DATABASE_URL            Postgres       (optional: persists sessions)
      #
      # Keep real values in `EntertainmentBOT/backend/.env` locally (it is
      # git-ignored). Never commit them.

      # ---- catalog sources ----
      - key: ENABLE_ANILIST_FALLBACK
        value: "true"
      - key: ENABLE_JIKAN_FALLBACK
        value: "true"
      - key: ENABLE_TVMAZE_FALLBACK
        value: "true"

      # ---- observability ----
      - key: LANGFUSE_HOST
        value: https://cloud.langfuse.com
      - key: LANGFUSE_ENVIRONMENT
        value: production
      - key: ENABLE_METRICS
        value: "true"

      # ---- limits / cache ----
      - key: MAX_SESSIONS
        value: "5"
      - key: MAX_QUERIES_PER_SESSION
        value: "10"
      - key: MAX_RECOMMENDATIONS
        value: "5"
      - key: CACHE_TTL_SECONDS
        value: "86400"
      # Set this AFTER the first deploy to the web service's URL, e.g.
      # https://entertainmentbot-web.onrender.com
      - key: CORS_ORIGINS
        value: "*"

  # ---------------------------------------------------------------- WEB ----
  - type: web
    name: entertainmentbot-web
    runtime: static
    rootDir: EntertainmentBOT/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      # Baked into the bundle at BUILD time by Vite, so it must be correct in
      # this file BEFORE the build runs — setting it later in the dashboard has
      # no effect until the next rebuild.
      #
      # NOT secret, so the blueprint manages it. Previously it was `sync: false`,
      # which made Render treat it as managed-but-empty and wipe the real value.
      - key: VITE_API_BASE_URL
        value: https://entertainmentbot-api.onrender.com
      # Tell the SPA router to hand every path to index.html.
      - key: REACT_APP_rewrite
        value: "/* /index.html 200"